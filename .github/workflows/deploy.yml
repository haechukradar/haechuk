# 사이트 빌드 → Cloudflare Pages 업로드
# Cloudflare가 직접 빌드하면 무료 빌드가 월 500회라 15분 수집 주기를 못 따라가므로, 여기서 빌드하고 결과(dist)만 올린다.
# 실행: 코드 push 시, 수동 실행, 수집·발행 작업 끝난 뒤(workflow_call)
name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ['data/**', '**.md']
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true # 더 새 데이터로 배포가 들어오면 이전 배포는 취소
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: haechuk # config/site.mjs 의 cloudflareProject 와 같게
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 수집 작업이 방금 올린 데이터 커밋까지 포함
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare Secrets가 없어 업로드를 건너뜁니다"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
